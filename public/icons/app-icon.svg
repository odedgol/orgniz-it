<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#bgGrad)"/>

  <!-- Calendar body -->
  <rect x="96" y="140" width="320" height="280" rx="24" ry="24" fill="url(#calGrad)"/>

  <!-- Calendar header (red top) -->
  <rect x="96" y="140" width="320" height="70" rx="24" ry="24" fill="#ef4444"/>
  <rect x="96" y="180" width="320" height="30" fill="#ef4444"/>

  <!-- Calendar rings -->
  <rect x="160" y="110" width="24" height="60" rx="12" ry="12" fill="#374151"/>
  <rect x="328" y="110" width="24" height="60" rx="12" ry="12" fill="#374151"/>

  <!-- Calendar grid lines -->
  <line x1="96" y1="280" x2="416" y2="280" stroke="#c7d2fe" stroke-width="2"/>
  <line x1="96" y1="340" x2="416" y2="340" stroke="#c7d2fe" stroke-width="2"/>

  <line x1="176" y1="210" x2="176" y2="420" stroke="#c7d2fe" stroke-width="2"/>
  <line x1="256" y1="210" x2="256" y2="420" stroke="#c7d2fe" stroke-width="2"/>
  <line x1="336" y1="210" x2="336" y2="420" stroke="#c7d2fe" stroke-width="2"/>

  <!-- Checkmark circle -->
  <circle cx="380" cy="380" r="60" fill="#22c55e"/>
  <path d="M350 380 L370 400 L410 355" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Calendar dates (dots/marks) -->
  <circle cx="136" cy="245" r="12" fill="#6366f1"/>
  <circle cx="216" cy="245" r="12" fill="#94a3b8"/>
  <circle cx="296" cy="245" r="12" fill="#94a3b8"/>

  <circle cx="136" cy="310" r="12" fill="#94a3b8"/>
  <circle cx="216" cy="310" r="12" fill="#6366f1"/>
  <circle cx="296" cy="310" r="12" fill="#94a3b8"/>

  <circle cx="136" cy="375" r="12" fill="#94a3b8"/>
  <circle cx="216" cy="375" r="12" fill="#94a3b8"/>
</svg>
