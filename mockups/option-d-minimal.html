<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option D - Minimal Modern Tasks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0A0A0B;
      color: #FAFAFA;
      padding: 40px;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: #141416;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #A1A1A6;
    }
    .add-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #A1A1A6;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-btn:hover {
      background: rgba(255,255,255,0.05);
      color: #FAFAFA;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .progress-text {
      font-size: 14px;
      color: #FAFAFA;
    }
    .progress-text span {
      color: #6B6B70;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: #2A2A30;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3DCC79, #22D3EE);
      border-radius: 2px;
      width: 60%;
      transition: width 0.3s ease;
    }
    .task-list {
      display: flex;
      flex-direction: column;
    }
    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: background 0.2s;
      cursor: pointer;
    }
    .task-row:hover {
      background: #1A1A1D;
    }
    .task-row:last-child {
      border-bottom: none;
    }
    .task-row.completed {
      opacity: 0.5;
    }
    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #3A3A40;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
    }
    .checkbox:hover {
      border-color: #5A5A60;
    }
    .checkbox.checked {
      background: #3DCC79;
      border-color: #3DCC79;
    }
    .checkbox.checked::after {
      content: '✓';
      color: white;
      font-size: 13px;
      font-weight: bold;
    }
    .task-content {
      flex: 1;
      min-width: 0;
    }
    .task-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .task-row.completed .task-title {
      text-decoration: line-through;
      color: #6B6B70;
    }
    .task-meta {
      font-size: 13px;
      color: #6B6B70;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .task-meta .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #4A4A4F;
    }
    .subject-color {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .subject-color.blue { background: #5E6AD2; }
    .subject-color.green { background: #3DCC79; }
    .subject-color.orange { background: #F59E0B; }
    .subject-color.purple { background: #9F7AEA; }
    .delete-btn {
      opacity: 0;
      background: none;
      border: none;
      color: #4A4A4F;
      cursor: pointer;
      padding: 4px;
      margin-top: 2px;
      transition: all 0.2s;
    }
    .task-row:hover .delete-btn {
      opacity: 1;
    }
    .delete-btn:hover {
      color: #EF4444;
    }
    .add-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.2);
    }
    .add-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4A4A4F;
      font-size: 18px;
    }
    .add-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #FAFAFA;
      font-size: 15px;
      outline: none;
    }
    .add-input::placeholder {
      color: #4A4A4F;
    }
    .label {
      display: inline-block;
      background: #1C1C1F;
      color: #A1A1A6;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="label">Option D: Minimal Modern (Clean & Simple)</span>

    <div class="card">
      <div class="header">
        <div class="header-top">
          <h1>Today's Focus</h1>
          <button class="add-btn">+ Add Task</button>
        </div>
        <div class="progress-row">
          <span class="progress-text">3 <span>of 5 completed</span></span>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
        </div>
      </div>

      <div class="task-list">
        <div class="task-row completed">
          <div class="checkbox checked"></div>
          <div class="task-content">
            <div class="task-title">Fix the window component</div>
            <div class="task-meta">
              <span class="subject-color blue"></span>
              System Design
              <span class="dot"></span>
              09:00
            </div>
          </div>
          <button class="delete-btn">✕</button>
        </div>

        <div class="task-row completed">
          <div class="checkbox checked"></div>
          <div class="task-content">
            <div class="task-title">Review pull requests</div>
            <div class="task-meta">
              <span class="subject-color green"></span>
              Algorithms
              <span class="dot"></span>
              10:30
            </div>
          </div>
          <button class="delete-btn">✕</button>
        </div>

        <div class="task-row completed">
          <div class="checkbox checked"></div>
          <div class="task-content">
            <div class="task-title">Write unit tests for auth</div>
            <div class="task-meta">
              <span class="subject-color blue"></span>
              System Design
              <span class="dot"></span>
              14:00
            </div>
          </div>
          <button class="delete-btn">✕</button>
        </div>

        <div class="task-row">
          <div class="checkbox"></div>
          <div class="task-content">
            <div class="task-title">Prepare for technical interview</div>
            <div class="task-meta">
              <span class="subject-color orange"></span>
              Job Search
              <span class="dot"></span>
              16:00
            </div>
          </div>
          <button class="delete-btn">✕</button>
        </div>

        <div class="task-row">
          <div class="checkbox"></div>
          <div class="task-content">
            <div class="task-title">Study system design patterns</div>
            <div class="task-meta">
              <span class="subject-color purple"></span>
              Learning
              <span class="dot"></span>
              18:00
            </div>
          </div>
          <button class="delete-btn">✕</button>
        </div>
      </div>

      <div class="add-row">
        <span class="add-icon">+</span>
        <input type="text" class="add-input" placeholder="Add a task...">
      </div>
    </div>
  </div>
</body>
</html>
